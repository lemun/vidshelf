<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">How Vidshelf works</title><desc id="desc">React SPA requests pass through nginx to the NestJS API, which stores metadata in MongoDB and signs upload and playback access. The API calls MinIO to stat or delete objects. Browser uploads use presigned POST policies; playback uses presigned GET URLs and HTTP range requests directly with MinIO. Video bytes bypass nginx and the API.</desc><rect x="0" y="0" width="1600" height="800" rx="24" fill="#0E131B" stroke="none" stroke-width="2"/><text x="64" y="91" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#F8FAFC" >How Vidshelf works</text><text x="64" y="137" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#B9C4D4" >The API handles metadata. The browser moves the video.</text><text x="64" y="202" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#B9C4D4" >Requests &amp; metadata</text><rect x="64" y="238" width="330" height="176" rx="16" fill="#161E2A" stroke="#3A4657" stroke-width="2"/><text x="90" y="287" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC" >Browser</text><text x="90" y="333" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B9C4D4" >React SPA</text><text x="90" y="365" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B9C4D4" >Upload · browse · watch</text><rect x="494" y="238" width="240" height="176" rx="16" fill="#161E2A" stroke="#3A4657" stroke-width="2"/><text x="520" y="287" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC" >nginx</text><text x="520" y="333" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B9C4D4" >Static SPA</text><text x="520" y="365" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B9C4D4" >/api proxy</text><rect x="834" y="238" width="310" height="176" rx="16" fill="#161E2A" stroke="#3A4657" stroke-width="2"/><text x="860" y="287" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC" >NestJS API</text><text x="860" y="333" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B9C4D4" >Auth · signed URLs</text><text x="860" y="365" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B9C4D4" >Video metadata</text><rect x="1244" y="238" width="292" height="176" rx="16" fill="#161E2A" stroke="#3A4657" stroke-width="2"/><text x="1270" y="287" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC" >MongoDB</text><text x="1270" y="333" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B9C4D4" >Users · videos</text><text x="1270" y="365" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B9C4D4" >Refresh sessions</text><path d="M406 308 H480 m-10 -7 10 7 -10 7" stroke="#B9C4D4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M746 308 H820 m-10 -7 10 7 -10 7" stroke="#B9C4D4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M1156 308 H1230 m-10 -7 10 7 -10 7" stroke="#B9C4D4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1156" y="287" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#B9C4D4" >Mongoose</text><path d="M120 414 V610 H818 m-12 -8 12 8 -12 8" stroke="#FFAA70" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M120 430 l-8 12 m8 -12 8 12" stroke="#FFAA70" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="164" y="522" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFAA70" >Presigned POST upload</text><text x="164" y="562" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#FFAA70" >Presigned GET + range playback</text><path d="M989 414 V514 m-8 -12 8 12 8 -12" stroke="#B9C4D4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1016" y="467" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B9C4D4" >stat / delete objects</text><rect x="834" y="526" width="702" height="142" rx="16" fill="#161E2A" stroke="#3A4657" stroke-width="2"/><rect x="860" y="552" width="56" height="56" rx="12" fill="#30251F" stroke="none" stroke-width="2"/><path d="M876 568 H900 V592 H876 Z M876 576 H900" stroke="#FFAA70" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="936" y="573" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC" >MinIO object storage</text><text x="936" y="615" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#B9C4D4" >Original videos + thumbnails</text><path d="M64 714 H1536" stroke="#3A4657" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="758" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#F8FAFC" >Video bytes go directly between the browser and MinIO.</text></svg>